  <style> 
      :root {
          --cor-fundo: #FFF8DC;
          --cor-texto: #000000;
          --cor-header: #FFF0F5;
          --cor-main: #FFFFE0;
          --cor-borda: #FFEFD5;
          --cor-botao: #FFFFF0;
        }

        body.escuro {
        --cor-fundo: #121212;
        --cor-texto: #ffffff;
        --cor-header: #1f2937;
        --cor-main: #374151;
        --cor-borda: #ffffff;
        --cor-botao: #222222;
        }

        body {
        background-color: var(--cor-fundo);
        color: var(--cor-texto);
        margin: 0;
        font-family: Arial, sans-serif;  
            
        transition: background-color 0.3s, color 0.3s;
        }

  header {
      background-color: var(--cor-header);
      color: var(--cor-texto);
      text-align: center;
      max-width: 800px;
      margin: 20px auto;
      padding:16px;
      border: 5px solid var(--cor-borda);
      border-radius: 8px;
  } 
      
  main {
      background-color: var(--cor-main);
      color: var(--cor-texto);
      max-width: 800px;
      margin: 0 auto;
      padding:16px;
      border-radius: 8px;
  }
      
      article{
      display: flex;
      align-items: center;
      gap: 25px;
          
      background-color: var(--cor-fundo);
      color: var(--cor-texto);
          
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 8px;
  }

 article img {
    width: 250px;
    height: 250px;
    object-fit: cover;
    background-color: #ffffff;
    border-radius: 8px;
    flex-shrink: 0;
}
.conteudo {
            flex: 1;
        }

        .botoes {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        article button {
            padding: 8px 12px;
            border: 1px solid var(--cor-borda);
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            background-color: #D8D7FC;
            color: #000000;
        }

        article button:hover {
            opacity: 0.8;
        }

        #botaoTema {
            position: fixed;
            right: 20px;
            bottom: 20px;

            padding: 12px 16px;
            border: 1px solid var(--cor-borda);
            border-radius: 8px;

            cursor: pointer;
            font-size: 16px;

            background-color: var(--cor-botao);
            color: var(--cor-texto);

            z-index: 1000;
        }

        #botaoTema:hover {
            opacity: 0.8;
        }
      
</style>

  <script>
      const botaoTema = document.getElementById("botaoTema");

        botaoTema.addEventListener("click", function () {

            document.body.classList.toggle("escuro");

            if (document.body.classList.contains("escuro")) {
                botaoTema.textContent = "☀️";
            } else {
                botaoTema.textContent = "🌙";
            }

        });
      
      const botoes = document.querySelectorAll(".botao-curtida");

      botoes.forEach( function(botao){
         let curtiu = false; 
         botao.addEventListener("click", botaoClicado);
         function botaoClicado(){
           console.log("fui clicado");
           let texto = botao.querySelector("span");
           if (curtiu === false){ 
           texto.textContent++;
           curtiu = true;
      } else{
          texto.textContent--; 
          curtiu = false;     
         }         
      } 
   })
